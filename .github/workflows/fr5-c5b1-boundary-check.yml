name: FR5 C5B1 bounded search kernel (no ROS)
on:
  push:
    branches:
      - codex/fr5-p2b3-c5b1-boundary-search-20261012
  workflow_dispatch:
jobs:
  freeze-and-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen C1/C4 blob and baseline identity check
        run: python scripts/verify_p2b3_c5b1_frozen_baseline.py
      - name: Install lightweight test dependency
        run: python -m pip install pytest
      - name: C5B1 signed search adversarial tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q -p no:cacheprovider tests/test_p2b3_c5b1_boundary.py
      - name: Execute staged synthetic pilot then all twelve rays
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python scripts/run_p2b3_c5b1_boundary.py --backend fixture --mode staged --output-json "${{ runner.temp }}/c5b1_synthetic.json"
          python -c 'import json,sys; v=json.load(open(sys.argv[1])); assert v["measurement_type"] == "SYNTHETIC_TEST_NOT_FR5"; assert v["stages"]["pilot"]["ray_count"] == 4 and v["stages"]["all"]["ray_count"] == 12; print("SYNTHETIC_STAGED_4_AND_12_RAYS=PASS_NOT_FR5")' "${{ runner.temp }}/c5b1_synthetic.json"

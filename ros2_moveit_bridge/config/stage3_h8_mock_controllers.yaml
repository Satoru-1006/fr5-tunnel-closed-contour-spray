controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    fairino5_controller:
      type: joint_trajectory_controller/JointTrajectoryController

fairino5_controller:
  ros__parameters:
    joints:
      - j1
      - j2
      - j3
      - j4
      - j5
      - j6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
      - acceleration
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_integration_in_goal_trajectories: false
    interpolate_from_desired_state: false
    interpolation_method: none
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
      j1: {trajectory: 0.05, goal: 0.05}
      j2: {trajectory: 0.05, goal: 0.05}
      j3: {trajectory: 0.05, goal: 0.05}
      j4: {trajectory: 0.05, goal: 0.05}
      j5: {trajectory: 0.05, goal: 0.05}
      j6: {trajectory: 0.05, goal: 0.05}
